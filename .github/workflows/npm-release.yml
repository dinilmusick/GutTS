name: npm Release

on:
  workflow_run:
    workflows: ["GutTS CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: "Actually publish to npm (leave false to validate only)"
        required: true
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - name: Update npm CLI for OIDC Trusted Publishing
        run: npm install --global npm@latest
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test
        run: pnpm run test
      - name: Inspect package contents
        run: npm pack --dry-run
      - name: Bump patch version when this version was already published
        if: github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            npm version patch --no-git-tag-version
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): bump GutTS package version [skip ci]"
            git push origin HEAD:main
          fi
      - name: Validate package metadata
        id: package
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (p.private) throw new Error('Refusing to publish: package.json has private=true');
          if (!p.name || !p.version) throw new Error('package.json must define name and version');
          if (p.publishConfig?.registry !== 'https://registry.npmjs.org/') throw new Error('Unexpected npm registry');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'name=' + p.name + '\nversion=' + p.version + '\n');
          NODE
      - name: Check whether this version is already published
        id: registry
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm using Trusted Publishing
        if: (github.event_name == 'workflow_run' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && steps.registry.outputs.exists == 'false'
        run: npm publish --access public

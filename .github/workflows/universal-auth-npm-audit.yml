name: Universal Auth npm registry audit
# Recheck artifact after propagation-ready Kloks frozen install
on:
  push:
    branches:
      - audit/universal-auth-npm-registry-20261121
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Verify immutable package-version availability
        shell: bash
        run: |
          set -euo pipefail
          for item in '@dinilmusick/gutts@2.2.3' '@dinilmusick/gutts@2.2.4' '@ultrst-armada/kloks@2.2.8' '@ultrst-armada/kloks@2.2.9' '@ultrst-armada/skipo@1.3.1' '@ultrst-armada/skipo@1.3.2'; do
            if npm view "$item" version --registry=https://registry.npmjs.org/ --json > /tmp/out 2>/tmp/err; then
              echo "AUDIT_NPM_EXISTS $item $(cat /tmp/out)"
            elif grep -Eq 'E404|404 Not Found' /tmp/err; then
              echo "AUDIT_NPM_ABSENT $item"
            else
              echo "AUDIT_NPM_ERROR $item"
              cat /tmp/err
              exit 1
            fi
          done

      - name: Independent immutable GutTS 2.2.4 artifact verification
        shell: bash
        run: |
          echo "AUDIT_VERIFYING_GUTTS_224_ARTIFACT"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          npm pack '@dinilmusick/gutts@2.2.4' --pack-destination "$tmp" --silent
          archive="$(find "$tmp" -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$archive"
          tar -tzf "$archive" | grep -Fx 'package/dist/auth/universalInitialization.js'
          tar -tzf "$archive" | grep -Fx 'package/dist/auth/universalInitializationClient.js'
          expected="$(npm view '@dinilmusick/gutts@2.2.4' dist.integrity --registry=https://registry.npmjs.org/)"
          actual="sha512-$(openssl dgst -sha512 -binary "$archive" | openssl base64 -A)"
          test "$expected" = "$actual"
          echo "AUDIT_GUTTS_224_SIGNED_REGISTRY_INTEGRITY_PASS"

      - name: Probe deployed Luth public discovery and unauthenticated config boundaries
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base='https://luth.blueprint-ninjastudios.workers.dev';
          async function checked(route, expected) {
            const response=await fetch(base+route, {headers:{accept:'application/json'}, signal:AbortSignal.timeout(20000)});
            assert.equal(response.status,expected,route+' status');
            assert.match(response.headers.get('cache-control')||'', expected===200?/max-age=/:/no-store/);
            return response.json();
          }
          for(const app of ['srkl','aiko']) {
            const doc=await checked('/api/discovery/v1?app_id='+app,200);
            assert.equal(doc.application.appId,app);
            assert.equal(doc.issuer,base+'/api/auth');
            assert.equal(doc.configurationUrl,base+'/api/config/v1');
            assert(!JSON.stringify(doc).toLowerCase().includes('clientsecret'));
            console.log('LUTH_PRODUCTION_DISCOVERY_PASS '+app);
          }
          await checked('/api/discovery/v1?app_id=unknown',404);
          await checked('/api/config/v1?app_id=srkl',401);
          console.log('LUTH_PRODUCTION_UNAUTHENTICATED_DENIAL_PASS');
          NODE
